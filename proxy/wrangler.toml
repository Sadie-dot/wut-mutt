name = "wutmutt-identify"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Daily rate cap (DAILY_CAP reveals/day per IPv4 address, or per /64 for IPv6 —
# see rateSubject in src/index.js). Without this binding the Worker runs
# uncapped — it deploys fine either way, so it's easy to miss.
#
# The namespace TITLE and the BINDING are different things. Titles are
# account-global, so this one is "WUTMUTT_RATE_KV" to avoid colliding with
# Lemon Pig's "RATE_KV"; the binding stays RATE_KV because that's what
# src/index.js reads (env.RATE_KV). Sharing a namespace between the two apps
# would mean one person's fruit scans eating this app's daily reveals — the
# rate-limit key format (`rl:<ip>:<date>`) is identical in both Workers.
[[kv_namespaces]]
binding = "RATE_KV"
id = "95e768d5cd6f4f3c8fe3f087953e20ba"

[vars]
# TEMPORARILY 400 for the App Review window (raised 2026-09-02) so a
# reviewer can't hit the intermission card mid-review and read it as a
# breakage. REVERT TO "40" and redeploy after approval.
DAILY_CAP = "400"

# Which breed names Claude actually returns, so the bundled photo set can be
# sourced against real frequency instead of a guess at AKC's list. Breed name,
# position and percentage only — never IPs, never image data. Optional: the
# Worker runs fine with this binding removed. The dataset is created
# automatically on first write.
[[analytics_engine_datasets]]
binding = "BREEDS_AE"
dataset = "wutmutt_breeds"

# Secrets are NOT set here — never commit them. Set with:
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put APP_TOKEN
